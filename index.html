<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { navy: { 800: '#1e293b', 900: '#0f172a' }, neon: { green: '#10b981', orange: '#f97316' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .kanban-col { min-height: 400px; min-width: 300px; }
        #loader { display: none; background: #0f172a; z-index: 9999; }
        .spinner { border: 4px solid rgba(16, 185, 129, 0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #10b981; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        select { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; appearance: none; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <div id="loader" class="fixed inset-0 flex items-center justify-center">
        <div class="flex flex-col items-center">
            <div class="spinner mb-4 shadow-[0_0_15px_rgba(16,185,129,0.5)] rounded-full"></div>
            <p class="text-neon-green font-bold tracking-widest animate-pulse">AUTHENTICATING...</p>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-[110] flex flex-col gap-2 pointer-events-none"></div>

    <div id="confirm-modal" class="hidden fixed inset-0 bg-navy-900/90 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-800 border border-slate-600 p-6 rounded-xl w-full max-w-sm shadow-2xl text-center">
            <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-500/50">
                <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
            </div>
            <h3 class="text-xl font-black text-white mb-2">Confirm Action</h3>
            <p class="text-slate-400 text-sm mb-6 font-medium" id="confirm-msg">Are you sure you want to proceed?</p>
            <div class="flex justify-center space-x-3">
                <button type="button" onclick="document.getElementById('confirm-modal').classList.add('hidden')" class="px-5 py-2 text-sm font-bold text-slate-300 hover:text-white bg-slate-700 hover:bg-slate-600 rounded transition-colors">Cancel</button>
                <button type="button" id="confirm-btn" class="bg-red-500 text-white px-5 py-2 rounded text-sm font-bold hover:bg-red-600 shadow-lg shadow-red-500/30 transition-colors">Delete</button>
            </div>
        </div>
    </div>

    <div id="login-screen" class="fixed inset-0 bg-navy-900 z-50 flex flex-col items-center justify-center">
        <div class="w-full max-w-md p-8 glass-panel rounded-2xl shadow-2xl border-t-4 border-t-neon-green">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-neon-green/10 text-neon-green mb-4 border border-neon-green/30">
                    <i class="fa-solid fa-bolt text-4xl"></i>
                </div>
                <h1 class="text-3xl font-black tracking-tight text-white uppercase italic">Operations OS</h1>
                <p class="text-slate-400 mt-2 font-medium">Internal Management System</p>
            </div>
            <form id="login-form" class="space-y-6" onsubmit="App.Auth.login(event)">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Operative ID (Email)</label>
                    <input type="email" id="login-email" required class="w-full bg-navy-800 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-neon-green transition-colors" placeholder="admin@system.com">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Access Code</label>
                    <input type="password" id="login-password" required class="w-full bg-navy-800 border border-slate-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-neon-green transition-colors" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-neon-green text-navy-900 font-extrabold py-3 rounded-lg hover:bg-emerald-400 transition-colors shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                    INITIALIZE LINK
                </button>
            </form>
        </div>
    </div>

    <div id="app-layout" class="hidden w-full h-full flex relative">
        <aside class="w-64 bg-navy-800 border-r border-slate-700 flex flex-col transition-transform duration-300 z-40 absolute sm:relative h-full -translate-x-full sm:translate-x-0" id="sidebar">
            <div class="h-16 flex items-center justify-between px-6 border-b border-slate-700 bg-navy-900">
                <div class="flex items-center">
                    <i class="fa-solid fa-bolt text-neon-green mr-3 text-xl"></i>
                    <span class="text-lg font-black italic tracking-wider text-white uppercase">Ops OS</span>
                </div>
                <button id="close-sidebar-btn" class="sm:hidden text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div class="p-4 flex flex-col gap-3 border-b border-slate-700/50 bg-slate-800/20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-neon-green/20 border border-neon-green flex items-center justify-center text-neon-green font-bold text-lg" id="user-avatar">A</div>
                    <div class="flex-1 overflow-hidden">
                        <p class="text-sm font-bold text-white leading-tight truncate" id="user-name">Admin</p>
                        <p class="text-[10px] text-neon-green font-bold uppercase tracking-wider truncate mt-0.5" id="user-role">System Admin</p>
                    </div>
                </div>
                <button onclick="App.Views.Settings.openModal()" class="text-xs text-slate-400 hover:text-white text-left flex items-center mt-1 transition-colors font-medium">
                    <i class="fa-solid fa-key mr-1.5"></i> Change Access Code
                </button>
            </div>

            <nav class="flex-1 overflow-y-auto custom-scrollbar py-4 px-3 space-y-1" id="nav-menu"></nav>

            <div class="p-4 border-t border-slate-700 bg-navy-900">
                <button onclick="App.Auth.logout()" class="w-full flex items-center justify-center text-red-400 hover:text-white hover:bg-red-500/20 px-3 py-2 rounded-lg transition-all font-bold">
                    <i class="fa-solid fa-power-off mr-2"></i><span>Disconnect</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 bg-navy-900 relative">
            <header class="h-16 flex items-center justify-between px-4 sm:px-6 border-b border-slate-700 glass-panel z-30 sticky top-0">
                <div class="flex items-center">
                    <button id="mobile-menu-btn" class="sm:hidden text-slate-400 hover:text-white mr-4 transition-colors"><i class="fa-solid fa-bars text-xl"></i></button>
                    <h2 id="current-view-title" class="text-xl font-extrabold text-white tracking-wide uppercase">Command Center</h2>
                </div>
                <div class="flex items-center gap-4">
                    <div id="sync-indicator" class="hidden items-center text-xs font-bold text-neon-green bg-neon-green/10 border border-neon-green/30 px-3 py-1.5 rounded-full shadow-[0_0_10px_rgba(16,185,129,0.2)]">
                        <i class="fa-solid fa-rotate animate-spin mr-2"></i> Syncing...
                    </div>
                    <button onclick="App.API.syncAll(true)" class="text-slate-400 hover:text-neon-green transition-colors flex items-center text-sm font-medium" title="Force Pull">
                        <i class="fa-solid fa-cloud-arrow-down mr-1.5"></i> <span class="hidden sm:inline">Pull Data</span>
                    </button>
                </div>
            </header>

            <div id="view-container" class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 lg:p-8"></div>
        </main>
    </div>

    <div id="password-modal" class="hidden fixed inset-0 bg-navy-900/90 z-50 flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-slate-800 border border-slate-600 p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4 uppercase"><i class="fa-solid fa-shield-halved text-neon-green mr-2"></i>Security Protocol</h3>
            <form onsubmit="App.Views.Settings.savePassword(event)" class="space-y-4">
                <div><label class="block text-xs font-bold uppercase text-slate-400 mb-1">New Access Code</label><input type="password" id="set-new-pass" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:border-neon-green focus:outline-none"></div>
                <div><label class="block text-xs font-bold uppercase text-slate-400 mb-1">Confirm Access Code</label><input type="password" id="set-confirm-pass" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:border-neon-green focus:outline-none"></div>
                <div class="flex justify-end space-x-3 mt-4 pt-4 border-t border-slate-700"><button type="button" onclick="App.Utils.closeModals()" class="px-4 py-2 text-sm font-bold text-slate-400 hover:text-white transition-colors">Cancel</button><button type="submit" class="bg-neon-green text-navy-900 px-5 py-2 rounded text-sm font-extrabold hover:bg-emerald-400 shadow-lg">Update Security</button></div>
            </form>
        </div>
    </div>

    <script>
        const App = {
            State: {
                user: null, db: {}, activeView: 'dashboard', charts: {}, calcTarget: 0, activeSKU: null,
                activeTabs: { content: 'pipeline', distribution: 'inventory', finance: 'ledger', product: 'sku' }
            },
            Config: {
                roles: ['Admin', 'Content & Marketing', 'Distribution', 'Finance', 'Product Development'],
                // 🔴 PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE 🔴
                WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbxh6S2rN2feb-_I7szOplixdNIzi_0-kX4Z-T-_f2t1T7GdBBiLg7xm-J0khqlvMumP/exec', 
            },

            Utils: {
                showLoader: () => document.getElementById('loader').style.display = 'flex',
                hideLoader: () => document.getElementById('loader').style.display = 'none',
                showSync: () => document.getElementById('sync-indicator').classList.replace('hidden', 'flex'),
                hideSync: () => document.getElementById('sync-indicator').classList.replace('flex', 'hidden'),
                toast: (msg, type = 'success') => {
                    const container = document.getElementById('toast-container');
                    const toast = document.createElement('div');
                    const color = type === 'success' ? 'bg-neon-green text-navy-900' : 'bg-red-500 text-white';
                    toast.className = `${color} px-4 py-3 rounded-lg shadow-2xl transition-all duration-300 translate-y-full opacity-0 flex items-center gap-3 font-bold text-sm pointer-events-auto`;
                    toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-triangle-exclamation'} text-lg"></i> ${msg}`;
                    container.appendChild(toast);
                    setTimeout(() => toast.classList.remove('translate-y-full', 'opacity-0'), 10);
                    setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3000);
                },
                confirm: (msg, onConfirm) => {
                    App.Utils.closeModals();
                    document.getElementById('confirm-msg').innerHTML = msg;
                    document.getElementById('confirm-modal').classList.remove('hidden');
                    const btn = document.getElementById('confirm-btn');
                    btn.onclick = () => { document.getElementById('confirm-modal').classList.add('hidden'); onConfirm(); };
                },
                formatDate: (dateString) => {
                    if (!dateString) return '-';
                    const d = new Date(dateString);
                    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                },
                getWeekNumber: (d) => {
                    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
                    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
                    var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
                    return Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
                },
                formatCurrency: (amount) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount || 0),
                closeModals: () => {
                    document.querySelectorAll('[id$="-modal"]').forEach(m => m.classList.add('hidden'));
                    document.getElementById('confirm-modal').classList.add('hidden');
                },
                generateTempId: (prefix) => prefix + 'TEMP-' + Date.now()
            },

            API: {
                isSyncing: false,
                syncQueue: [],
                
                processQueue: async () => {
                    if (App.API.isSyncing || App.API.syncQueue.length === 0) return;
                    App.API.isSyncing = true;
                    
                    const task = App.API.syncQueue.shift();
                    
                    try {
                        const response = await fetch(App.Config.WEB_APP_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(task.requestBody)
                        });
                        const res = await response.json();
                        if (task.resolve) task.resolve(res);
                    } catch (error) {
                        console.error("Background Sync Failed:", error);
                        if (task.reject) task.reject(error);
                    } finally {
                        App.API.isSyncing = false;
                        App.API.processQueue(); // Process next item
                    }
                },

                enqueue: (requestBody) => {
                    return new Promise((resolve, reject) => {
                        App.API.syncQueue.push({ requestBody, resolve, reject });
                        App.API.processQueue();
                    });
                },

                optimisticSave: async (action, payload, table, primaryKey, isUpdate = false, isDelete = false) => {
                    App.Utils.closeModals();
                    App.Utils.showSync();
                    
                    if(table && App.State.db[table]) {
                        if (isDelete) {
                            App.State.db[table] = App.State.db[table].filter(item => item[primaryKey] !== payload[primaryKey]);
                        } else if (isUpdate) {
                            const idx = App.State.db[table].findIndex(item => item[primaryKey] === payload[primaryKey]);
                            if (idx > -1) App.State.db[table][idx] = { ...App.State.db[table][idx], ...payload };
                        } else {
                            App.State.db[table].push(payload); 
                        }
                    }
                    
                    App.Router.navigate(App.State.activeView, true); 

                    try {
                        const res = await App.API.enqueue({ action, auth: { email: App.State.user.email, password: App.State.user.password }, payload });
                        
                        if (res.status === 'success') {
                            await App.API.syncAll(false, true); 
                            App.Utils.hideSync();
                        } else {
                            throw new Error(res.message);
                        }
                    } catch (err) {
                        App.Utils.hideSync();
                        App.Utils.toast("Sync Failed. Reverting changes.", 'error');
                        await App.API.syncAll(false, true); 
                    }
                },

                call: async (action, payload = {}) => {
                    return new Promise(async (resolve, reject) => {
                        App.Utils.showLoader();
                        try {
                            const request = { action, auth: App.State.user ? { email: App.State.user.email, password: App.State.user.password } : payload.auth, payload };
                            const res = await App.API.enqueue(request);
                            App.Utils.hideLoader();
                            if (res.status === 'success') resolve(res); else { App.Utils.toast(res.message, 'error'); reject(res.message); }
                        } catch (err) {
                            App.Utils.hideLoader(); App.Utils.toast("Network/Server Error. Check Web App URL.", 'error'); reject(err);
                        }
                    });
                },
                
                syncAll: async (showToast = false, silent = false) => {
                    if(!silent) App.Utils.showSync();
                    try {
                        const request = { action: 'syncAll', auth: { email: App.State.user.email, password: App.State.user.password } };
                        const res = await App.API.enqueue(request);
                        App.State.db = res.data;
                        localStorage.setItem('ops_db_cache', JSON.stringify(res.data));
                        App.Utils.hideSync();
                        if(showToast) App.Utils.toast("Data Up to date");
                        
                        // CRITICAL FIX: Only force UI re-render if it's NOT a silent background sync.
                        // This prevents wiping out what the user is currently typing/viewing!
                        if(!silent) {
                            App.Router.navigate(App.State.activeView, true);
                        }
                    } catch(e) { App.Utils.hideSync(); App.Utils.toast("Sync Failed", "error"); }
                }
            },

            Auth: {
                login: async (e) => {
                    e.preventDefault();
                    const email = document.getElementById('login-email').value;
                    const password = document.getElementById('login-password').value;
                    try {
                        const res = await App.API.call('login', { auth: { email, password } });
                        App.State.user = { ...res.data, email, password };
                        document.getElementById('user-name').textContent = App.State.user.Name || 'Operative';
                        document.getElementById('user-role').textContent = App.State.user.Role;
                        document.getElementById('user-avatar').textContent = (App.State.user.Name || 'O').charAt(0).toUpperCase();
                        document.getElementById('login-screen').classList.add('hidden');
                        document.getElementById('app-layout').classList.remove('hidden');
                        App.UI.buildNavigation();
                        
                        const cache = localStorage.getItem('ops_db_cache');
                        if(cache) { App.State.db = JSON.parse(cache); App.Router.navigate('dashboard'); App.API.syncAll(false, true); } 
                        else { await App.API.syncAll(); }
                    } catch (err) {}
                },
                logout: () => {
                    App.State.user = null; App.State.db = {}; localStorage.removeItem('ops_db_cache');
                    document.getElementById('app-layout').classList.add('hidden');
                    document.getElementById('login-screen').classList.remove('hidden');
                    document.getElementById('login-password').value = '';
                }
            },

            UI: {
                buildNavigation: () => {
                    const nav = document.getElementById('nav-menu');
                    const role = App.State.user.Role;
                    const navItem = (id, icon, label) => `<a href="#" onclick="App.Router.navigate('${id}')" class="flex items-center px-3 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-700/50 transition-all group ${App.State.activeView===id?'bg-slate-700/80 text-white border-l-4 border-neon-green':'border-l-4 border-transparent'}"><i class="fa-solid ${icon} w-6 text-center group-hover:text-neon-green transition-colors ${App.State.activeView===id?'text-neon-green':''}"></i><span class="ml-2 font-bold tracking-wide text-sm">${label}</span></a>`;
                    const sec = (title) => `<div class="pt-5 pb-2"><p class="px-3 text-[10px] font-extrabold uppercase tracking-widest text-slate-500">${title}</p></div>`;
                    
                    let links = navItem('dashboard', 'fa-gauge-high', 'Command Center') + navItem('tasks', 'fa-list-check', 'Task Grid');
                    if (role === 'Admin' || role === 'Content & Marketing') links += sec('Comms & Growth') + navItem('content', 'fa-bullhorn', 'Content Engine');
                    if (role === 'Admin' || role === 'Distribution') links += sec('Logistics') + navItem('distribution', 'fa-truck-fast', 'Distribution & Inv');
                    if (role === 'Admin' || role === 'Finance') links += sec('Capital') + navItem('finance', 'fa-building-columns', 'Finance & Funding');
                    if (role === 'Admin' || role === 'Product Development') links += sec('R & D') + navItem('product', 'fa-flask', 'Product Matrix');
                    if (role === 'Admin') links += sec('System') + navItem('users', 'fa-users-gear', 'Team Directory');
                    nav.innerHTML = links;
                }
            },

            Router: {
                navigate: (view, forceRefresh = false) => {
                    if (App.State.activeView === view && !forceRefresh) return;
                    App.State.activeView = view;
                    App.UI.buildNavigation();
                    const container = document.getElementById('view-container');
                    const title = document.getElementById('current-view-title');
                    container.innerHTML = '';
                    Object.keys(App.State.charts).forEach(key => { if(App.State.charts[key]) App.State.charts[key].destroy(); });
                    App.State.charts = {};

                    const views = {
                        'dashboard': { title: 'Command Center', r: App.Views.Dashboard.render },
                        'tasks': { title: 'Task Grid', r: App.Views.Tasks.render },
                        'content': { title: 'Content Engine', r: App.Views.Content.render, p: App.Views.Content.postRender },
                        'distribution': { title: 'Distribution & Inv', r: App.Views.Distribution.render, p: App.Views.Distribution.postRender },
                        'finance': { title: 'Finance & Funding', r: App.Views.Finance.render, p: App.Views.Finance.postRender },
                        'product': { title: 'Product Matrix', r: App.Views.Product.render, p: App.Views.Product.postRender },
                        'users': { title: 'Team Directory', r: App.Views.Users.render }
                    };

                    if (views[view]) {
                        title.textContent = views[view].title;
                        container.innerHTML = views[view].r();
                        if(views[view].p) setTimeout(views[view].p, 50);
                    }
                    if(window.innerWidth < 640) document.getElementById('sidebar').classList.add('-translate-x-full');
                }
            },

            Views: {
                Settings: {
                    openModal: () => { App.Utils.closeModals(); document.getElementById('set-new-pass').value = ''; document.getElementById('set-confirm-pass').value = ''; document.getElementById('password-modal').classList.remove('hidden'); },
                    savePassword: async (e) => {
                        e.preventDefault();
                        const p1 = document.getElementById('set-new-pass').value;
                        if(p1 !== document.getElementById('set-confirm-pass').value) return App.Utils.toast("Passwords mismatch!", "error");
                        try {
                            await App.API.call('updatePassword', { newPassword: p1 });
                            App.State.user.password = p1; App.Utils.closeModals(); App.Utils.toast("Security Clearance Updated");
                        } catch(err){}
                    }
                },

                Dashboard: {
                    render: () => {
                        const tasks = App.State.db.Tasks || [];
                        const myTasks = tasks.filter(t => t.EmpID === App.State.user.EmpID && !t.CompletedDate);
                        const urgentTasks = myTasks.filter(t => t.Deadline && new Date(t.Deadline) < new Date(Date.now() + 86400000*2)).sort((a,b)=>new Date(a.Deadline)-new Date(b.Deadline));
                        let gStats = '';
                        
                        if(App.State.user.Role === 'Admin') {
                            const sales = (App.State.db.Sales || []).reduce((sum, s)=>sum+Number(s.Revenue||0), 0);
                            const actCont = (App.State.db.Content || []).filter(c=>!['Published', '1 Week Monitoring'].includes(c.Stage)).length;
                            
                            let totM = 0, doneM = 0;
                            (App.State.db.ProductCategory||[]).forEach(c => {
                                try { let m = JSON.parse(c.MilestonesJSON); if(Array.isArray(m)){ totM += m.length; doneM += m.filter(x=>x.done).length; } } catch(e){}
                            });

                            gStats = `<div class="col-span-1 md:col-span-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                                <div class="glass-panel rounded-xl p-5 border-t-2 border-neon-green"><p class="text-xs font-bold text-slate-400 uppercase">Global Revenue</p><p class="text-2xl font-black text-white mt-1">${App.Utils.formatCurrency(sales)}</p></div>

                        let html = `<div class="flex justify-between items-center mb-6"><h2 class="text-xl font-extrabold text-white uppercase tracking-wider">Protocol Grid</h2><button onclick="document.getElementById('task-modal').classList.remove('hidden')" class="bg-neon-green text-navy-900 px-4 py-2 rounded-lg font-bold hover:bg-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.3)]"><i class="fa-solid fa-plus mr-1"></i> New Protocol</button></div>`;

                    render: () => {
                        if(App.State.user.Role !== 'Admin') return `<div class="glass-panel p-10 text-center rounded-xl text-red-500 font-bold border-red-500/20"><i class="fa-solid fa-shield-halved text-4xl mb-4 block"></i> Access Denied. Administrator Clearance Required.</div>`;
                        return `<div class="flex justify-between items-center mb-6"><h2 class="text-xl font-extrabold text-white uppercase tracking-wider">Operative Directory</h2><button onclick="document.getElementById('user-modal').classList.remove('hidden')" class="bg-neon-green text-navy-900 px-4 py-2 rounded-lg font-bold hover:bg-emerald-400 transition-colors shadow-lg"><i class="fa-solid fa-user-plus mr-1"></i> Provision</button></div>
                            <div class="glass-panel rounded-xl overflow-hidden border border-slate-700 shadow-xl"><table class="w-full text-left text-sm"><thead class="bg-slate-800/80 text-slate-300 border-b border-slate-700 text-xs uppercase font-bold tracking-wider"><tr><th class="p-4">ID</th><th class="p-4">Name</th><th class="p-4">Email</th><th class="p-4">Role</th><th class="p-4"></th></tr></thead><tbody class="divide-y divide-slate-700/50 text-slate-300 font-medium">
                            ${(App.State.db.Users || []).map(u => `<tr class="hover:bg-slate-800/40 transition-colors"><td class="p-4 font-mono text-xs text-slate-500">${u.EmpID}</td><td class="p-4 text-white font-bold">${u.Name}</td><td class="p-4 text-slate-400">${u.Email}</td><td class="p-4"><span class="px-2 py-1 rounded text-[10px] uppercase font-bold border ${u.Role==='Admin'?'bg-red-500/10 text-red-400 border-red-500/30':'bg-slate-700 text-neon-green border-neon-green/30'}">${u.Role}</span></td><td class="p-4 text-right">${u.EmpID!==App.State.user.EmpID?`<button onclick="App.Views.Users.del('${u.EmpID}')" class="text-slate-500 hover:text-red-400 transition-colors"><i class="fa-solid fa-trash"></i></button>`:''}</td></tr>`).join('')}
                            </tbody></table></div>
                            <div id="user-modal" class="hidden fixed inset-0 bg-navy-900/90 z-50 flex items-center justify-center p-4"><div class="bg-slate-800 border border-slate-600 p-6 rounded-xl w-full max-w-sm"><h3 class="text-lg font-bold text-white mb-4 uppercase">Provision Profile</h3><form onsubmit="App.Views.Users.save(event)" class="space-y-4"><div><label class="block text-xs font-bold text-slate-400 uppercase">Name</label><input type="text" id="usr-name" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></div><div><label class="block text-xs font-bold text-slate-400 uppercase">Email</label><input type="email" id="usr-email" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></div><div><label class="block text-xs font-bold text-slate-400 uppercase">Temp Code</label><input type="text" id="usr-pass" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></div><div><label class="block text-xs font-bold text-slate-400 uppercase">Role</label><select id="usr-role" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white">${App.Config.roles.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="flex justify-end space-x-3 mt-4 pt-4 border-t border-slate-700"><button type="button" onclick="App.Utils.closeModals()" class="px-4 py-2 text-sm font-bold text-slate-400 hover:text-white transition-colors">Cancel</button><button type="submit" class="bg-neon-green text-navy-900 px-6 py-2 rounded text-sm font-extrabold hover:bg-emerald-400 transition-colors shadow">Provision</button></div></form></div></div>`;
                    },
                    save: (e) => { e.preventDefault(); App.API.optimisticSave('createUser', { EmpID: App.Utils.generateTempId('USR-'), Name: document.getElementById('usr-name').value, Email: document.getElementById('usr-email').value, PasswordHash: document.getElementById('usr-pass').value, Role: document.getElementById('usr-role').value }, 'Users', 'EmpID'); },
                    del: (id) => App.Utils.confirm("Are you sure you want to terminate this Operative Profile?", () => App.API.optimisticSave('deleteUser', {EmpID:id}, 'Users', 'EmpID', false, true))
                }
            }
        };

        window.onload = () => {
            document.getElementById('mobile-menu-btn').addEventListener('click', () => document.getElementById('sidebar').classList.remove('-translate-x-full'));
            document.getElementById('close-sidebar-btn').addEventListener('click', () => document.getElementById('sidebar').classList.add('-translate-x-full'));
        };
    </script>
</body>
</html>
